<aside class="col-lg-3 pt-lg-5">
    <h2 class="fs-2 fw-normal mb-3">Popular Tags</h2>
    <div class="d-flex flex-wrap row-gap-2 column-gap-3 mb-4">
        {% for tag in popular_tags %}
        <a href="{% url 'tag' tag.name %}" class="text-decoration-none {{ tag.css }}">{{ tag.name }}</a>
        {% endfor %}
    </div>

    <h2 class="fs-2 fw-normal mb-3">Best Members</h2>
    <ul class="list-unstyled m-0 p-0">
        {% for member in best_members %}
        <li class="mb-3"><a href="#">{{ member }}</a></li>
        {% endfor %}
    </ul>
</aside>
