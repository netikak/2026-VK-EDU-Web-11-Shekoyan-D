{% load static %}
<article class="card question-card mb-4">
    <div class="card-body d-flex gap-3">
        <div class="d-flex flex-column align-items-center gap-3">
            <img class="avatar avatar--medium" src="{% static 'core/img/avatar.svg' %}" alt="Аватар автора ответа">
            {% include 'questions/includes/rating.html' with rating=answer.rating state=answer.rating_state label='Рейтинг ответа' %}
        </div>
        <div class="flex-grow-1 d-flex flex-column min-w-0">
            <p class="card-text">{{ answer.text }}</p>
            <div class="d-flex flex-wrap align-items-center gap-2 gap-sm-4 mt-auto">
                <div class="form-check">
                    <input class="form-check-input border-dark border-2" type="checkbox" id="correct-{{ answer.id }}"{% if answer.is_correct %} checked{% endif %}>
                    <label class="form-check-label" for="correct-{{ answer.id }}">Correct!</label>
                </div>
            </div>
        </div>
    </div>
</article>
