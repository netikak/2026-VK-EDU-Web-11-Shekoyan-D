name: askpupkin-hw4
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:?Укажите DB_NAME в .env.docker}
      POSTGRES_USER: ${DB_USER:?Укажите DB_USER в .env.docker}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Укажите DB_PASSWORD в .env.docker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 20
  web:
    build: .
    env_file: .env.docker
    volumes:
      - static_files:/app/static
      - media_files:/app/media
    depends_on:
      db:
        condition: service_healthy
    command: >-
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python manage.py runserver 0.0.0.0:8000"
  nginx:
    build: ./nginx
    ports:
      - "127.0.0.1:8001:80"
    depends_on:
      - web
    volumes:
      - static_files:/srv/static:ro
      - media_files:/srv/media:ro
volumes:
  postgres_data:
  static_files:
  media_files:
